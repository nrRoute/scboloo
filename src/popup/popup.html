<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scboloo</title>
    <link rel="stylesheet" href="/popup.css" />
  </head>
  <body>
    <main class="container">
      <form id="converterForm">
        <label for="imageList">Select image to use as page symbol</label>
        <div id="imageList"></div>

        <label for="dontUseImageCheckBox">Don't use image</label>
        <input type="checkbox" id="dontUseImageCheckBox" />

        <label for="projectSelect">Project</label>
        <select id="projectSelect"></select>

        <label for="pageTitle">タイトル</label>
        <input type="text" id="pageTitle" autocomplete="off" required />

        <label for="scrapboxText">メモ</label>
        <textarea id="scrapboxText" rows="5" placeholder='Write page body text'></textarea>

        <button id='createButton'>Create Page</button>
      </form>
    </main> 
    <script src='/popup.js'></script>
  </body>
</html>
